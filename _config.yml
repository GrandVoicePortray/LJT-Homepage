teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider:
analytics:
  provider: "false"
  google:
    tracking_id:
social:
  type:
  name:
  links:
og_image: og-image.png
og_description:

include: [".htaccess", "_pages", "files"]
exclude: [".git", "node_modules", "vendor", "Gemfile", "package.json", "README", "LICENSE", "Dockerfile", ".devcontainer", "scripts", "talkmap", "talkmap.py", "talkmap.ipynb", "talkmap_out.ipynb", "markdown_generator", "assets/js/_main.js", "assets/js/plugins", "assets/js/vendor", ".asset-cache", ".bundle", ".github", ".jekyll-assets-cache", ".sass-cache", "CHANGELOG", "Capfile", "config", "Gruntfile.js", "gulpfile.js", "local", "log", "Rakefile", "tmp"]
keep_files: [".git", ".svn"]
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC

collections:
  teaching: {output: true, permalink: "/:collection/:path/"}
  publications: {output: true, permalink: "/:collection/:path/"}
  portfolio: {output: true, permalink: "/:collection/:path/"}
  talks: {output: true, permalink: "/:collection/:path/"}

defaults:
  - scope: {path: "", type: "posts"}
    values: {layout: "single", author_profile: true, read_time: true, comments: true, share: true, related: true}
  - scope: {path: "", type: "pages"}
    values: {layout: "single", author_profile: true}
  - scope: {path: "", type: "teaching"}
    values: {layout: "single", author_profile: true, share: true, comments: true}
  - scope: {path: "", type: "publications"}
    values: {layout: "single", author_profile: true, share: true, comments: true}
  - scope: {path: "", type: "portfolio"}
    values: {layout: "single", author_profile: true, share: true, comment: true}
  - scope: {path: "", type: "talks"}
    values: {layout: "talk", author_profile: true, share: true}

plugins: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]
whitelist: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
